; Limites d'envoi de l'API, lues par PHP chez OVH (mode CGI/FPM : c'est .user.ini qui s'applique,
; pas php_value dans .htaccess, qui provoquerait une erreur 500). Le changement met jusqu'à cinq
; minutes à être pris en compte (user_ini.cache_ttl).
;
; Pourquoi ces valeurs : upload.php refuse déjà toute photo de plus de 15 Mo (MAX_BYTES, RG-30) et
; une photo réduite à 2560 px pèse en pratique bien moins. On laisse donc une marge au-dessus de
; 15 Mo pour que ce soit l'application qui refuse, avec son message, et non PHP qui vide $_FILES
; sans explication. Au-delà, plus rien n'est accepté : moins de données non authentifiées entrent
; dans PHP, ce qui limite la surface des failles d'analyse de requête (CVE-2026-109618 et
; CVE-2026-109619, octobre 2026). Ce n'est qu'une réduction de surface : la correction, elle, est la
; version de PHP, qui se choisit dans l'espace client OVH.
upload_max_filesize = 16M
post_max_size = 17M
max_file_uploads = 2
