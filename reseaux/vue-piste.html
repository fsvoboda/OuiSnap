<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css"><style>
/* Vue 4 : la photo de la piste, horizontale, posée sur le fond sapin du carrousel. */
.vue { padding: 0; justify-content: center; align-items: center; position: relative; }
.photo { width: 1080px; display: block; }
.bas { position: absolute; bottom: 96px; left: 0; right: 0; text-align: center; }
.bas .phrase { font-family: var(--serif); font-style: italic; font-size: 52px; line-height: 1.2; color: var(--creme); }
.bas .marque { margin-top: 34px; font-size: 19px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--or); }
.haut { position: absolute; top: 104px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--or); }
</style></head><body>
<div class="vue sombre">
  <p class="haut">Ce que voit un invité</p>
  <img class="photo" src="brut-04-piste-corrigee.png">
  <div class="bas">
    <p class="phrase">Il photographie.<br>Vous ne voyez rien.</p>
    <p class="marque">Jusqu’au lendemain</p>
  </div>
</div>
</body></html>
