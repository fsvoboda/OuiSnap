<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css"><style>
/* Vue 2 : les trois objections levées, en capitales espacées, centrées. */
.vue { justify-content: center; align-items: center; text-align: center; }
.trois { display: flex; flex-direction: column; gap: 54px; }
.trois span { font-size: 54px; font-weight: 600; letter-spacing: 0.16em; line-height: 1.15; }
.sep { width: 96px; height: 1px; background: var(--or); margin: 0 auto; }
.pied { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center; }
.pied .logo { font-size: 36px; }
.pied .par { display: block; margin-top: 12px; font-size: 17px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--or); }
</style></head><body>
<div class="vue sombre">
  <div class="trois">
    <span>RIEN À INSTALLER</span>
    <div class="sep"></div>
    <span>AUCUN COMPTE</span>
    <div class="sep"></div>
    <span>UN PRÉNOM SUFFIT</span>
  </div>
  <div class="pied">
    <span class="logo">Oui<i>Snap</i></span>
    <span class="par">par PourUnOuiEternel</span>
  </div>
</div>
</body></html>
